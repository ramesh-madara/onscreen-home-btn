plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ramesh.lockbutton'
    compileSdk 34

    defaultConfig {
        applicationId "com.ramesh.lockbutton"
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Intentionally empty: 0 external libraries, 0 bloat
}

